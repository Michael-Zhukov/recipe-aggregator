[project]
name = "recipe-aggregator"
version = "0.1.0"
description = "Збір та аналіз рецептів"
requires-python = ">=3.12"

dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
]

[project.optional-dependencies]
dev = ["ruff", "pytest", "pre-commit", "mypy"]

[project.scripts]
recipe-aggregator = "recipe_aggregator.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
show_error_codes = true
warn_unused_ignores = true